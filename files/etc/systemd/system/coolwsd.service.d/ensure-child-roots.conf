# On overlayfs with a virtiofs upper layer, non-root users cannot replace overlayfs
# whiteout entries: ovl_override_creds() escalates to root in the kernel, but FUSE
# requests still carry the calling thread's uid, so virtiofsd enforces POSIX permissions
# as the non-root user.
#
# child-roots is kept out of the squashfs lowerdir to avoid this. If it were in the
# lowerdir, coolwsd's startup cleanup ("remove empty directories recursively") would
# rmdir it, overlayfs would create a whiteout, and no non-root process could recreate
# it (EACCES when replacing the whiteout via virtiofs FUSE).
#
# This ExecStartPre runs as root ("+") to pre-create child-roots in the upper layer
# only, before coolwsd starts. This serves two purposes:
#   1. Ensures the root-owned /opt/ parent chain is copy-upped to the upper layer,
#      which cool cannot trigger itself (same virtiofs FUSE uid restriction).
#   2. Gives coolwsd's setupChildRoot fork a pre-existing child-roots to work with,
#      so it takes the namespace isolation path (coolforkit-ns --namespace) rather
#      than falling back to the chroot-caps path (coolforkit-caps, which we do not
#      install).
# After cleanup removes child-roots from the upper layer (no whiteout, since it has
# no lowerdir entry), the fork and kit processes recreate it freely as the cool user.
[Service]
ExecStartPre=+/bin/bash -c 'mkdir -p /opt/cool/child-roots /opt/cool/cache && chown cool:cool /opt/cool /opt/cool/child-roots /opt/cool/cache'
